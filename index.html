<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Doorway: get a professional website for your small business in under 10 minutes.">
<style>[hidden]{display:none!important}body{margin:0}img{max-width:100%}</style>
<title>Doorway Site Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600;700&family=Cormorant+Garamond:wght@500;600&family=Fraunces:opsz,wght@9..144,500;9..144,700&family=DM+Sans:wght@400;500;700&family=Archivo+Black&family=Archivo:wght@400;600&family=Fredoka:wght@500;600&family=Manrope:wght@400;600;800&display=swap">
<style>
/* Layout: app shell = slim top bar + one working view (quiz | generation | editor). Editor = tool sidebar + device canvas. */
:root{
  --bg:#F5F6FA; --surface:#FFFFFF; --surface2:#EDEFF6; --fg:#13162A; --muted:#5B6179; --line:#DDE0EA;
  --accent:#3B47F5; --accent-fg:#FFFFFF; --accent-soft:#E5E7FF; --ok:#16935F; --ok-soft:#DDF4EA; --warn:#A35A00;
  --shadow:0 1px 2px rgba(19,22,42,.06),0 8px 24px rgba(19,22,42,.06);
  --f-display:"Bricolage Grotesque","Figtree",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D0F17; --surface:#151826; --surface2:#1D2132; --fg:#ECEEF7; --muted:#9BA1B8; --line:#2A2F44;
  --accent:#8A93FF; --accent-fg:#0D0F17; --accent-soft:#242a52; --ok:#4CD39A; --ok-soft:#12342A; --warn:#F2B35C;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0D0F17; --surface:#151826; --surface2:#1D2132; --fg:#ECEEF7; --muted:#9BA1B8; --line:#2A2F44;
  --accent:#8A93FF; --accent-fg:#0D0F17; --accent-soft:#242a52; --ok:#4CD39A; --ok-soft:#12342A; --warn:#F2B35C;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark }
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5;transition:background .3s,color .3s}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{text-wrap:balance}
.app{min-height:100%;display:flex;flex-direction:column}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:flex;align-items:center;gap:16px;padding:12px 20px;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:700;font-size:19px;letter-spacing:-.01em}
.brand-mark{width:28px;height:28px;border-radius:8px;background:var(--fg);display:grid;place-items:center}
.brand-mark span{width:10px;height:15px;border-radius:5px 5px 1px 1px;background:var(--bg);box-shadow:inset -3px 0 0 var(--accent)}
.steps{display:flex;gap:4px;margin-inline:auto;background:var(--surface2);padding:4px;border-radius:999px}
.steps button{border:0;background:transparent;padding:6px 14px;border-radius:999px;font-size:13px;font-weight:600;color:var(--muted);display:flex;gap:6px;align-items:center}
.steps button[aria-current="step"]{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
.steps button:disabled{opacity:.45;cursor:default}
.steps i{font-style:normal;font-size:11px;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;background:var(--line)}
.steps button[aria-current="step"] i{background:var(--accent);color:var(--accent-fg)}
.chip-demo{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--warn);border:1px solid currentColor;border-radius:999px;padding:3px 9px;white-space:nowrap}
.icon-btn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.icon-btn svg{width:18px;height:18px}
@media (max-width:520px){.brand{font-size:0;gap:0}.steps button{padding:6px 8px}.acct{padding:0 9px}.bar{gap:8px}}
@media (max-width:760px){.chip-demo{display:none}.steps button span{display:none}.bar{padding:10px 16px;gap:10px}}

/* buttons & fields */
.btn{border:1px solid var(--line);background:var(--surface);padding:10px 16px;border-radius:10px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:8px;transition:transform .15s,background .15s}
.btn:hover{background:var(--surface2)}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:transparent}
.btn.primary:hover{filter:brightness(1.08);background:var(--accent)}
.btn.big{padding:13px 22px;font-size:15px;border-radius:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn svg{width:16px;height:16px}
label.f{display:grid;gap:6px;font-size:13px;font-weight:600}
.f small{font-weight:400;color:var(--muted)}
.inp{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:11px 13px;font-size:15px;transition:border .15s,box-shadow .15s}
.inp:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea.inp{resize:vertical;min-height:84px;line-height:1.45}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-size:14px;font-weight:500;display:inline-flex;gap:8px;align-items:center}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--fg);box-shadow:inset 0 0 0 1px var(--accent)}
.lbl{font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}

/* quiz */
.quiz{display:grid;grid-template-columns:minmax(0,560px) minmax(0,1fr);gap:40px;padding-block:40px;padding-inline:24px;max-width:1240px;margin:0 auto;width:100%}
.qcard{display:grid;gap:22px;align-content:start;animation:rise .4s ease both}
.qprog{display:flex;gap:6px}
.qprog span{height:4px;flex:1;border-radius:4px;background:var(--line);transition:background .3s}
.qprog span.on{background:var(--accent)}
.qcard h1{font-family:var(--f-display);font-size:clamp(28px,4vw,40px);line-height:1.08;letter-spacing:-.025em;margin:0}
.qcard .lede{color:var(--muted);margin:-10px 0 0;font-size:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.vibes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.vibe{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:14px;text-align:left;display:grid;gap:4px;transition:border .15s,transform .15s}
.vibe:hover{transform:translateY(-2px)}
.vibe[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.vibe b{font-size:26px;line-height:1.1;font-weight:500}
.vibe small{color:var(--muted);font-size:13px}
.sw{display:inline-flex}
.sw i{width:14px;height:14px;border-radius:50%;margin-left:-4px;border:2px solid var(--surface)}
.sw i:first-child{margin-left:0}
.drop{border:1.5px dashed var(--line);border-radius:var(--r);padding:16px;display:flex;align-items:center;gap:14px;background:var(--surface);cursor:pointer;transition:border .15s}
.drop:hover{border-color:var(--accent)}
.drop input{position:absolute;opacity:0;width:1px;height:1px}
.drop .di{width:44px;height:44px;border-radius:10px;background:var(--surface2);display:grid;place-items:center;flex:none;overflow:hidden}
.drop .di img{width:100%;height:100%;object-fit:cover}
.drop b{display:block;font-size:14px}
.drop small{color:var(--muted);font-size:13px}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumbs img{width:56px;height:56px;object-fit:cover;border-radius:8px}
.import{border:1px solid var(--line);background:var(--ok-soft);border-radius:var(--r);padding:14px 16px;display:grid;gap:6px;font-size:14px}
.import b{color:var(--ok);font-size:13px;letter-spacing:.04em;text-transform:uppercase}
.qnav{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:6px}
.qnav .count{color:var(--muted);font-size:13px}
.live{position:sticky;top:90px;align-self:start;display:grid;gap:12px}
.live-head{display:flex;justify-content:space-between;align-items:center}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-right:6px;animation:pulse 1.6s infinite}
.browser{border-radius:14px;overflow:hidden;border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow)}
.browser-top{display:flex;align-items:center;gap:6px;padding:9px 12px;border-bottom:1px solid var(--line);background:var(--surface2)}
.browser-top i{width:9px;height:9px;border-radius:50%;background:var(--line)}
.browser-top span{margin-left:10px;font-size:12px;color:var(--muted);background:var(--surface);border-radius:6px;padding:2px 10px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;min-width:0}
.thumb{position:relative;overflow:hidden;aspect-ratio:4/3.3}
.thumb.tall{aspect-ratio:4/5}
.thumb .site{position:absolute;top:0;left:0;width:1100px;transform-origin:top left;pointer-events:none}
@media (max-width:900px){.quiz{grid-template-columns:1fr;padding-block:24px;padding-inline:16px}.live{position:static}.grid2,.vibes{grid-template-columns:1fr 1fr}}
@media (max-width:480px){.grid2{grid-template-columns:1fr}}

/* generation */
.gen{max-width:1240px;margin:0 auto;width:100%;padding-block:40px;padding-inline:24px;display:grid;gap:28px}
.gen-head{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap}
.gen-head h1{font-family:var(--f-display);font-size:clamp(26px,3.6vw,38px);letter-spacing:-.025em;margin:0;line-height:1.1}
.gen-head p{color:var(--muted);margin:6px 0 0}
.loading{max-width:520px;margin:6vh auto 0;display:grid;gap:22px;text-align:center}
.loading h1{font-family:var(--f-display);font-size:30px;letter-spacing:-.02em;margin:0}
.bar-track{height:6px;border-radius:6px;background:var(--surface2);overflow:hidden}
.bar-fill{height:100%;background:var(--accent);width:0;transition:width .5s ease}
.tasks{list-style:none;padding:0;margin:0;display:grid;gap:10px;text-align:left}
.tasks li{display:flex;gap:12px;align-items:center;color:var(--muted);font-size:15px;transition:color .3s}
.tasks li i{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-style:normal;font-size:11px}
.tasks li.doing{color:var(--fg)}
.tasks li.doing i{border-color:var(--accent);border-right-color:transparent;animation:spin .7s linear infinite}
.tasks li.done{color:var(--fg)}
.tasks li.done i{background:var(--ok);border-color:var(--ok);color:#fff}
.opts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.opt{display:grid;gap:12px;animation:rise .5s ease both}
.opt:nth-child(2){animation-delay:.08s}.opt:nth-child(3){animation-delay:.16s}
.opt .browser{transition:transform .25s,box-shadow .25s}
.opt:hover .browser{transform:translateY(-4px);box-shadow:0 18px 40px rgba(19,22,42,.14)}
.opt-meta{display:flex;justify-content:space-between;align-items:start;gap:10px}
.opt-meta h3{margin:0;font-family:var(--f-display);font-size:20px;letter-spacing:-.01em}
.opt-meta p{margin:2px 0 0;color:var(--muted);font-size:13px}
.opt .btn{justify-content:center}
@media (max-width:900px){.opts{grid-template-columns:1fr}.gen{padding-inline:16px}}

/* editor */
.editor{flex:1;display:grid;grid-template-columns:300px minmax(0,1fr);min-height:0}
.side{border-right:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;min-height:0;max-height:calc(100vh - 61px);position:sticky;top:61px}
.tabs{display:flex;gap:2px;padding:10px;border-bottom:1px solid var(--line)}
.tabs button{flex:1;border:0;background:transparent;padding:8px;border-radius:8px;font-weight:600;font-size:13px;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--surface2);color:var(--fg)}
.panel{padding:18px;display:grid;gap:22px;overflow:auto;align-content:start}
.group{display:grid;gap:10px}
.pals{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pal{border:1px solid var(--line);border-radius:10px;padding:8px;background:var(--surface);display:grid;gap:6px;text-align:left;font-size:12px;font-weight:600}
.pal[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.pal .strip{display:flex;height:22px;border-radius:5px;overflow:hidden}
.pal .strip i{flex:1}
.fonts{display:grid;gap:6px}
.fontb{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;display:flex;justify-content:space-between;align-items:baseline;text-align:left}
.fontb[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.fontb b{font-size:20px;font-weight:500}
.fontb small{color:var(--muted);font-size:12px}
.tpls{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tplb{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px;display:grid;gap:6px;font-size:12px;font-weight:600}
.tplb[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.tplb svg{width:100%;height:auto;display:block}
.accent-row{display:flex;align-items:center;gap:10px;font-size:13px}
.accent-row input[type=color]{width:40px;height:32px;border:1px solid var(--line);border-radius:8px;padding:2px;background:var(--surface)}
.toggle{display:flex;justify-content:space-between;align-items:center;font-size:14px;gap:10px}
.sw-t{position:relative;width:38px;height:22px;flex:none}
.sw-t input{opacity:0;position:absolute;inset:0;margin:0;cursor:pointer}
.sw-t span{position:absolute;inset:0;border-radius:22px;background:var(--line);transition:background .2s;pointer-events:none}
.sw-t span::after{content:"";position:absolute;width:16px;height:16px;border-radius:50%;background:#fff;top:3px;left:3px;transition:transform .2s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.sw-t input:checked+span{background:var(--accent)}
.sw-t input:checked+span::after{transform:translateX(16px)}
.sel-box{border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--surface2);font-size:13px;display:grid;gap:10px}
.sel-box q{font-style:italic;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.row{display:flex;gap:8px;flex-wrap:wrap}
.serp{border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--surface);font-family:Arial,sans-serif;display:grid;gap:2px}
.serp .u{font-size:12px;color:var(--muted)}
.serp .t{font-size:17px;color:#1a0dab;line-height:1.3}
:root[data-theme="dark"] .serp .t{color:#8ab4f8}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .serp .t{color:#8ab4f8}}
.serp .d{font-size:13px;color:var(--muted)}
.count-l{font-size:12px;color:var(--muted);text-align:right}
.count-l.over{color:var(--warn)}

.work{display:flex;flex-direction:column;min-width:0}
.ebar{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--surface);flex-wrap:wrap;position:sticky;top:61px;z-index:10}
.seg{display:flex;background:var(--surface2);padding:3px;border-radius:10px;gap:2px}
.seg button{border:0;background:transparent;padding:6px 11px;border-radius:7px;font-size:13px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:6px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
.seg svg{width:16px;height:16px}
.spacer{flex:1}
.canvas-wrap{position:relative;flex:1;padding-block:28px;padding-inline:24px;background:repeating-linear-gradient(0deg,transparent 0 23px,color-mix(in srgb,var(--line) 45%,transparent) 23px 24px),repeating-linear-gradient(90deg,transparent 0 23px,color-mix(in srgb,var(--line) 45%,transparent) 23px 24px),var(--bg)}
.frame{margin:0 auto;width:100%;max-width:1180px;border-radius:14px;overflow:hidden;box-shadow:0 24px 60px rgba(19,22,42,.16);border:1px solid var(--line);transition:max-width .45s cubic-bezier(.2,.8,.2,1)}
.frame.tablet{max-width:768px}
.frame.phone{max-width:390px;border-radius:32px;border:8px solid var(--fg)}
.frame .browser-top{background:var(--surface2)}
.frame.phone .browser-top{display:none}
.fchip{position:absolute;z-index:5;display:flex;gap:4px;padding:4px;border-radius:10px;background:var(--fg);box-shadow:0 8px 24px rgba(0,0,0,.25);animation:rise .2s ease both}
.fchip button{border:0;background:transparent;color:var(--bg);font-size:12px;font-weight:600;padding:6px 10px;border-radius:7px;display:flex;gap:6px;align-items:center}
.fchip button:hover{background:color-mix(in srgb,var(--bg) 16%,transparent)}
.fchip svg{width:14px;height:14px}
@media (max-width:900px){
  .editor{grid-template-columns:1fr}
  .side{position:static;max-height:none;border-right:0;border-top:1px solid var(--line);order:2}
  .ebar{top:57px}
  .canvas-wrap{padding-inline:16px;padding-block:16px}
}

/* modal & toast */
.scrim{position:fixed;inset:0;background:rgba(10,12,20,.55);backdrop-filter:blur(4px);z-index:50;display:grid;place-items:center;padding:16px;animation:fade .2s ease both}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:18px;width:min(640px,100%);max-height:90vh;overflow:auto;padding:24px;display:grid;gap:20px;box-shadow:0 30px 80px rgba(0,0,0,.35);animation:rise .3s ease both}
.modal h2{font-family:var(--f-display);margin:0;font-size:26px;letter-spacing:-.02em}
.modal-x{justify-self:end;margin:-8px -8px -40px 0}
.domain{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
.domain input{border:0;padding:11px 0 11px 13px;flex:1;min-width:0;background:transparent;font-size:15px}
.domain input:focus{outline:none}
.domain span{padding-right:13px;color:var(--muted);font-size:15px;white-space:nowrap}
.domain:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.plans{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.plan{border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:6px;align-content:start;font-size:13px}
.plan.hl{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.plan h4{margin:0;font-size:14px}
.plan .p{font-family:var(--f-display);font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.plan .p small{font-size:13px;color:var(--muted);font-family:var(--f-body);font-weight:500}
.plan ul{margin:0;padding-left:16px;color:var(--muted);display:grid;gap:2px}
.lock{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);letter-spacing:.03em}
.live-ok{border-radius:12px;background:var(--ok-soft);padding:16px;display:grid;gap:8px}
.live-ok b{color:var(--ok)}
.live-ok code{font-size:15px;word-break:break-all}
@media (max-width:560px){.plans{grid-template-columns:1fr}}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:11px 18px;border-radius:12px;font-size:14px;font-weight:600;z-index:60;animation:rise .25s ease both;box-shadow:0 10px 30px rgba(0,0,0,.3);max-width:calc(100% - 32px)}

@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{50%{opacity:.35}}
@keyframes flash{0%{background:color-mix(in srgb,var(--accent) 30%,transparent)}100%{background:transparent}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

/* auth, dashboard, save state */
.boot{display:grid;place-items:center;min-height:60vh;color:var(--muted);gap:12px;align-content:center}
.spin{width:28px;height:28px;border-radius:50%;border:3px solid var(--line);border-right-color:var(--accent);animation:spin .7s linear infinite}
.auth{display:grid;grid-template-columns:1.1fr minmax(0,420px);gap:56px;max-width:1100px;margin:0 auto;width:100%;padding-block:8vh;padding-inline:24px;align-items:center}
.auth-pitch h1{font-family:var(--f-display);font-size:clamp(34px,5vw,58px);line-height:1.02;letter-spacing:-.03em;margin:12px 0 16px}
.auth-pitch>p{color:var(--muted);font-size:18px;max-width:44ch;margin:0}
.ticks{list-style:none;padding:0;margin:24px 0 0;display:grid;gap:10px}
.ticks li{display:flex;gap:10px;align-items:center;font-weight:500}
.ticks li::before{content:"✓";width:22px;height:22px;border-radius:50%;background:var(--ok-soft);color:var(--ok);display:grid;place-items:center;font-size:12px;font-weight:800;flex:none}
.auth-card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:28px;display:grid;gap:16px;box-shadow:var(--shadow)}
.auth-card h2{font-family:var(--f-display);margin:0;font-size:26px;letter-spacing:-.02em}
.auth-card .btn{justify-content:center}
.g-mark{width:18px;height:18px;border-radius:50%;background:conic-gradient(#EA4335 0 25%,#FBBC05 0 50%,#34A853 0 75%,#4285F4 0);flex:none}
.or{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:13px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.auth-msg{margin:0;padding:10px 12px;border-radius:10px;background:var(--accent-soft);font-size:14px}
.switch{margin:0;text-align:center;font-size:14px;color:var(--muted)}
.switch button{border:0;background:none;color:var(--accent);font-weight:600;padding:0}
@media (max-width:860px){.auth{grid-template-columns:1fr;gap:28px;padding-block:32px;padding-inline:16px}}
.newcard{border:1.5px dashed var(--line);border-radius:14px;display:grid;place-items:center;align-content:center;gap:6px;min-height:280px;background:transparent;color:var(--muted);font-weight:600;font-size:15px}
.newcard b{font-size:34px;font-weight:400;line-height:1;color:var(--accent)}
.newcard:hover{border-color:var(--accent);color:var(--fg)}
.st{font-size:12px;font-weight:700;border-radius:999px;padding:3px 10px;white-space:nowrap}
.st.live{color:var(--ok);background:var(--ok-soft)}
.st.draft{color:var(--muted);background:var(--surface2)}
.card-actions{display:flex;gap:8px;flex-wrap:wrap}
.card-actions .btn{padding:8px 12px;font-size:13px}
.btn.danger{color:var(--warn);border-color:currentColor}
.bk{border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow-x:auto}
.bk table{width:100%;border-collapse:collapse;font-size:13px}
.bk th,.bk td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
.bk th{color:var(--muted);font-weight:600}
.bk p{margin:0;padding:12px;color:var(--muted);font-size:13px}
.savest{font-size:13px;color:var(--muted);white-space:nowrap}
.savest[data-s="error"]{color:var(--warn)}
.acct{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:0 12px;height:36px;font-size:13px;font-weight:600;white-space:nowrap}
.domain .pre{padding:11px 0 11px 13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:62%;font-size:14px}
.domain .pre+input{padding-left:1px}
.pub-missing{max-width:520px;margin:12vh auto;padding-inline:16px;text-align:center;display:grid;gap:14px}
.pub-missing h1{font-family:var(--f-display);margin:0}

/* ===== Generated customer site (its own palette, set explicitly) ===== */
.site{container-type:inline-size;background:var(--sbg);color:var(--sfg);font-family:var(--sb);font-size:16px;line-height:1.6}
.site *{box-sizing:border-box}
.site h1,.site h2,.site h3{font-family:var(--sd);font-weight:var(--sdw);letter-spacing:var(--sls);line-height:1.05;margin:0}
.site p{margin:0}
.site a{color:inherit;text-decoration:none;cursor:pointer}
.s-nav{display:flex;align-items:center;justify-content:space-between;padding:22px 56px;gap:16px}
.s-logo{display:flex;align-items:center;gap:10px;font-family:var(--sd);font-weight:var(--sdw);font-size:22px;letter-spacing:var(--sls)}
.s-logo img{height:38px;width:auto;border-radius:6px}
.s-mono{width:38px;height:38px;border-radius:50%;background:var(--sac);color:var(--sbg);display:grid;place-items:center;font-size:15px;font-family:var(--sb);font-weight:700;letter-spacing:.02em}
.s-links{display:flex;gap:30px;font-size:14px;align-items:center}
.s-links a.on{border-bottom:1.5px solid var(--sac)}
.s-btn{background:var(--sac);color:var(--sbg);padding:13px 24px;border-radius:999px;font-weight:600;font-size:14px;display:inline-block;border:0;font-family:var(--sb)}
.s-link{font-weight:600;font-size:14px;border-bottom:1px solid currentColor;padding-bottom:2px}
.s-kicker{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--sac);font-weight:700}
.s-sub{font-size:19px;opacity:.82;max-width:46ch}
.s-hero{padding:56px 56px 72px;display:grid;gap:44px}
.s-hero-copy{display:grid;gap:22px;align-content:center}
.s-hero h1{font-size:76px}
.s-actions{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.s-rating{font-size:14px;opacity:.75;display:flex;gap:8px;align-items:center}
.s-rating b{color:var(--sac);letter-spacing:2px}
.ph{position:relative;background-size:cover;background-position:center;min-height:120px}
.ph-tag{position:absolute;left:12px;bottom:12px;font-size:11px;font-weight:600;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.82);color:#222;font-family:var(--sb)}
.s-sec{padding:72px 56px;display:grid;gap:36px}
.s-head{display:flex;justify-content:space-between;align-items:end;gap:20px}
.s-head h2,.s-about h2,.s-band h2{font-size:46px}
.s-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
.s-card{display:grid;gap:10px;align-content:start}
.s-card .ph{aspect-ratio:4/3;margin-bottom:8px}
.s-card h3{font-size:26px}
.s-card p{opacity:.78;font-size:15px}
.s-price{font-weight:700;opacity:1!important;color:var(--sac)}
.s-about{grid-template-columns:1fr 1fr;align-items:center;gap:64px;background:var(--ssoft)}
.s-about .ph{aspect-ratio:1/1}
.s-about>div:last-child{display:grid;gap:18px}
.s-about p:not(.s-kicker){opacity:.85;font-size:17px}
.s-quote{padding:88px 56px;text-align:center;display:grid;gap:18px;justify-items:center}
.s-quote blockquote{margin:0;font-family:var(--sd);font-weight:var(--sdw);font-size:38px;line-height:1.2;max-width:24ch;letter-spacing:var(--sls)}
.s-quote cite{font-style:normal;font-size:14px;opacity:.7}
.s-band{margin:0 56px 72px;padding:56px;background:var(--sfg);color:var(--sbg);display:flex;justify-content:space-between;align-items:center;gap:24px;border-radius:24px}
.s-band .s-btn{background:var(--sbg);color:var(--sfg)}
.s-page-head{padding:72px 56px 40px;display:grid;gap:18px;max-width:900px}
.s-page-head h1{font-size:68px}
.s-list{padding:0 56px 72px;display:grid}
.s-row{display:grid;grid-template-columns:1fr 2fr auto;gap:32px;padding:28px 0;border-top:1px solid color-mix(in srgb,var(--sfg) 16%,transparent);align-items:baseline}
.s-row h3{font-size:28px}
.s-row p{opacity:.78}
.s-row .s-price{font-size:18px;white-space:nowrap}
.s-values{grid-template-columns:repeat(3,1fr);gap:28px}
.s-values div{display:grid;gap:10px;border-top:2px solid var(--sac);padding-top:18px}
.s-values h3{font-size:24px}
.s-values p{opacity:.78;font-size:15px}
.s-wide{padding:0 56px}
.s-wide .ph{aspect-ratio:21/8}
.s-contact{padding:0 56px 72px;display:grid;grid-template-columns:1.2fr 1fr;gap:40px;align-items:start}
.s-form{background:var(--ssoft);padding:32px;border-radius:20px;display:grid;gap:14px}
.s-form h3{font-size:28px;margin-bottom:6px}
.s-form .two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.s-form label{display:grid;gap:6px;font-size:13px;font-weight:600}
.s-form input,.s-form select{border:1px solid color-mix(in srgb,var(--sfg) 22%,transparent);background:var(--sbg);color:var(--sfg);border-radius:10px;padding:12px;font-family:var(--sb);font-size:15px;width:100%}
.s-form .s-btn{justify-self:start;cursor:pointer}
.s-sent{padding:16px;border-radius:12px;background:var(--sbg);font-weight:600}
.s-info{display:grid;gap:22px}
.s-info dl{margin:0;display:grid;gap:16px}
.s-info dt{font-size:12px;letter-spacing:.14em;text-transform:uppercase;opacity:.6;font-weight:700}
.s-info dd{margin:2px 0 0;font-size:17px}
.s-map{aspect-ratio:4/3;border-radius:16px;position:relative;overflow:hidden;background:
 linear-gradient(115deg,transparent 46%,color-mix(in srgb,var(--sfg) 14%,transparent) 46% 48.5%,transparent 48.5%),
 linear-gradient(25deg,transparent 60%,color-mix(in srgb,var(--sfg) 10%,transparent) 60% 62%,transparent 62%),
 repeating-linear-gradient(0deg,transparent 0 38px,color-mix(in srgb,var(--sfg) 7%,transparent) 38px 40px),
 repeating-linear-gradient(90deg,transparent 0 38px,color-mix(in srgb,var(--sfg) 7%,transparent) 38px 40px),var(--ssoft)}
.s-pin{position:absolute;left:50%;top:44%;width:30px;height:30px;border-radius:50% 50% 50% 0;background:var(--sac);transform:translate(-50%,-50%) rotate(-45deg);box-shadow:0 6px 14px rgba(0,0,0,.25)}
.s-pin::after{content:"";position:absolute;inset:9px;border-radius:50%;background:var(--sbg)}
.s-map a{position:absolute;left:12px;bottom:12px;background:var(--sbg);color:var(--sfg);font-size:12px;font-weight:700;padding:7px 12px;border-radius:8px}
.s-foot{padding:40px 56px;border-top:1px solid color-mix(in srgb,var(--sfg) 14%,transparent);display:flex;justify-content:space-between;gap:20px;font-size:14px;flex-wrap:wrap}
.s-foot>div{display:grid;gap:4px}
.s-foot .s-logo{font-size:18px}
.s-made{font-size:12px;opacity:.6;align-self:end}

/* template A — Atelier: centered editorial */
.tpl-a .s-hero{justify-items:center;text-align:center;padding-top:72px}
.tpl-a .s-hero-copy{justify-items:center}
.tpl-a .s-hero h1{font-size:84px;max-width:13ch}
.tpl-a .s-sub{margin:0 auto}
.tpl-a .s-hero .ph{width:100%;aspect-ratio:21/9}
.tpl-a .s-card{text-align:center;justify-items:center}
.tpl-a .s-band{border-radius:0;margin:0;background:var(--ssoft);color:var(--sfg)}
.tpl-a .s-band .s-btn{background:var(--sac);color:var(--sbg)}
/* template B — Storefront: split hero, soft rounded */
.tpl-b .s-hero{grid-template-columns:1.05fr 1fr;align-items:center}
.tpl-b .s-hero .ph{aspect-ratio:4/5;border-radius:28px}
.tpl-b .s-card{background:var(--ssoft);padding:16px 16px 22px;border-radius:22px}
.tpl-b .s-card .ph{border-radius:14px}
.tpl-b .s-about{margin:0 56px;border-radius:28px;padding:56px}
.tpl-b .s-about .ph{border-radius:20px}
.tpl-b .s-map,.tpl-b .s-wide .ph{border-radius:20px}
/* template C — Statement: bold blocks, square corners */
.tpl-c .s-nav{border-bottom:2px solid var(--sfg)}
.tpl-c .s-btn{border-radius:0;text-transform:uppercase;letter-spacing:.08em;font-size:13px}
.tpl-c .s-hero{background:var(--sac);color:var(--sbg);grid-template-columns:1.3fr 1fr;align-items:end;padding-top:64px}
.tpl-c .s-hero h1{font-size:92px;text-transform:uppercase;line-height:.92}
.tpl-c .s-hero .s-kicker{color:var(--sbg);opacity:.85}
.tpl-c .s-hero .s-btn{background:var(--sfg);color:var(--sbg)}
.tpl-c .s-hero .ph{aspect-ratio:1/1;border:3px solid var(--sfg)}
.tpl-c .s-head h2,.tpl-c .s-page-head h1,.tpl-c .s-band h2{text-transform:uppercase}
.tpl-c .s-card{border:2px solid var(--sfg);padding:0 0 22px}
.tpl-c .s-card>:not(.ph){padding:0 20px}
.tpl-c .s-card .ph{margin:0;border-bottom:2px solid var(--sfg)}
.tpl-c .s-band{border-radius:0;margin:0;background:var(--sac)}
.tpl-c .s-band .s-btn{background:var(--sfg);color:var(--sbg)}
.tpl-c .s-form{border-radius:0;border:2px solid var(--sfg)}
.tpl-c .s-map{border-radius:0;border:2px solid var(--sfg)}

@container (max-width:820px){
  .s-nav{padding:16px 22px}
  .s-links a:not(.s-btn){display:none}
  .s-hero,.tpl-b .s-hero,.tpl-c .s-hero{grid-template-columns:1fr;padding:36px 22px 48px;gap:28px}
  .s-hero h1,.tpl-a .s-hero h1{font-size:44px}
  .tpl-c .s-hero h1{font-size:50px}
  .s-sub{font-size:17px}
  .s-sec,.s-quote{padding:48px 22px}
  .s-head h2,.s-about h2,.s-band h2{font-size:32px}
  .s-cards,.s-values{grid-template-columns:1fr}
  .s-about,.tpl-b .s-about{grid-template-columns:1fr;gap:28px;margin:0;border-radius:0;padding:48px 22px}
  .s-quote blockquote{font-size:28px}
  .s-band{flex-direction:column;align-items:start;margin:0 22px 48px;padding:32px}
  .tpl-a .s-band,.tpl-c .s-band{margin:0}
  .s-page-head{padding:44px 22px 28px}
  .s-page-head h1{font-size:44px}
  .s-list{padding:0 22px 48px}
  .s-row{grid-template-columns:1fr;gap:6px}
  .s-wide{padding:0 22px}
  .s-contact{grid-template-columns:1fr;padding:0 22px 48px}
  .s-form{padding:22px}
  .s-form .two{grid-template-columns:1fr}
  .s-foot{padding:32px 22px;flex-direction:column}
}
@container (min-width:821px) and (max-width:1000px){
  .s-hero h1,.tpl-a .s-hero h1,.tpl-c .s-hero h1{font-size:60px}
}

/* editing affordances on the customer site */
.editing [data-k]{outline:1.5px dashed transparent;outline-offset:3px;border-radius:3px;transition:outline-color .15s;cursor:text}
.editing [data-k]:hover{outline-color:color-mix(in srgb,var(--accent) 70%,transparent)}
.editing [data-k]:focus{outline:2px solid var(--accent)}
.editing [data-k].flash{animation:flash 1s ease}
.editing .ph{cursor:pointer}
.editing .ph:hover::after{content:"Swap photo";position:absolute;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.35);color:#fff;font-weight:700;font-size:14px;font-family:var(--f-body)}
.editing .s-form input,.editing .s-form select{pointer-events:none}

const slug=s=>(s||'my-site').toLowerCase().replace(/&/g,'and').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,40)||'my-site';
const initials=n=>(n||'?').split(/\s+/).filter(w=>/[A-Za-z]/.test(w[0])).slice(0,2).map(w=>w[0].toUpperCase()).join('');
function getP(o,p){return p.split('.').reduce((a,k)=>a==null?a:a[k],o);}
function setP(o,p,v){const ks=p.split('.');let a=o;ks.slice(0,-1).forEach(k=>a=a[k]);a[ks[ks.length-1]]=v;}
function money(n,I){n=Math.round(n*I.factor/5)*5||5;return (I.unit||'')+'$'+n.toLocaleString('en-US');}
let toastT;function toast(m){$('.toast')&&$('.toast').remove();const t=document.createElement('div');t.className='toast';t.setAttribute('role','status');t.textContent=m;document.body.appendChild(t);clearTimeout(toastT);toastT=setTimeout(()=>t.remove(),2600);}

function buildContent(b,v){
 const I=IND[b.industry];
 const svcNames=b.services.split(/[,\n]/).map(s=>s.trim()).filter(Boolean).slice(0,6);
 if(!svcNames.length)svcNames.push(...I.services);
 const tier=PRICE[b.price]||PRICE['$$'];
 const svc=svcNames.map((n,i)=>({name:n,desc:fill((I.desc[n.toLowerCase()]||I.gen[(i+v)%2]).replace('{svc}',n),b),price:money(tier[i%tier.length],I)}));
 while(svc.length<3)svc.push({name:'Gift cards',desc:'The easiest gift in '+b.city.split(',')[0]+', in any amount.',price:I.unit?'any amount':'any amount'});
 const cityShort=(b.city||'').split(',')[0];
 return {
  name:b.name||'Your Business',
  heroKicker:(v===2?fill('{noun} · {city}',b):I.label+' in '+cityShort),
  heroTitle:fill(I.heads[v%3],b), heroSub:fill(I.subs[v%3],b), cta:I.cta,
  svcTitle:['What we do','Services & pricing','Our menu of services'][v%3], svcIntro:'Transparent pricing, no surprises. Every service starts with a quick consultation.',

  quote:I.quote[0], quoteBy:I.quote[1],

  contactTitle:'Visit or book online', contactSub:'Pick a time that works for you. We confirm every request within the hour.',

 };

/* floating rewrite chip */
function showChip(el){
 hideChip();const w=$('#cwrap');if(!w||!rewritePool(el.dataset.k))return;
 const r=el.getBoundingClientRect(), wr=w.getBoundingClientRect();
 const ch=document.createElement('div');ch.className='fchip';ch.id='fchip';
 ch.innerHTML=`<button data-act="rewrite">${IC.spark}Rewrite</button><button data-act="shorter">${IC.cut}Shorter</button>`;
 ch.style.top=Math.max(4,r.top-wr.top-42)+'px';ch.style.left=Math.max(8,Math.min(r.left-wr.left,wr.width-200))+'px';
 w.appendChild(ch);
}
function hideChip(){const c=$('#fchip');if(c)c.remove();}
function rewritePool(k){
 if(!k)return null;const b=S.biz,I=IND[b.industry],V=VIBE[b.vibe],f=x=>fill(x,b);
 if(k==='heroTitle')return [...I.heads,...V.lines].map(f);
 if(k==='heroSub')return I.subs.map(f);
 if(k==='aboutTitle')return ['Why {city} chooses {name}','Our story','Made with care in {city}','The people behind {name}'].map(f);
 if(k==='aboutBody')return [I.about,'{name} is a locally owned {noun} in {city}. We keep things simple: honest prices, clear communication and work we are proud to put our name on. {diff}','We started {name} because {city} deserved better {craft}. Years later, we still treat every client like our first. {diff}'].map(f);
 if(k==='cta')return [I.cta,'Book now','Check availability','See open times'];
 if(k==='bandTitle')return ['Ready when you are.','Your spot is open this week.','Let\'s get you booked.','New clients welcome every day.'];
 if(k==='svcTitle')return ['What we do','Services & pricing','Our menu of services','How we can help'];
 const m=k.match(/^svc\.(\d+)\.desc$/);if(m){const n=S.site.c.svc[+m[1]].name;return [I.desc[n.toLowerCase()],...I.gen.map(g=>g.replace('{svc}',n))].filter(Boolean).map(f);}
 if(k==='quote'||k==='contactSub'||k==='svcIntro')return null;
 return null;
}
function typeInto(el,txt){
 const k=el.dataset.k;setP(S.site.c,k,txt);syncSame(el,txt);
 if(RM){el.textContent=txt;}else{let i=0;const step=Math.max(2,Math.ceil(txt.length/18));const iv=setInterval(()=>{i+=step;el.textContent=txt.slice(0,i);if(i>=txt.length){clearInterval(iv);el.textContent=txt;}},16);}
 el.classList.remove('flash');void el.offsetWidth;el.classList.add('flash');
 if(S.tab==='content')setTimeout(()=>{renderSide();},RM?0:320);
}
function syncSame(el,txt){$$(`.frame [data-k="${el.dataset.k}"]`).forEach(o=>{if(o!==el)o.textContent=txt;});}
function doRewrite(short){
 const el=S.sel&&document.querySelector(`.frame [data-k="${S.sel}"]`);if(!el)return;
 const cur=el.innerText.trim();
 if(short){
  const sent=cur.match(/^[^.!?]+[.!?]/);let out=sent&&sent[0].length<cur.length?sent[0]:cur.split(/\s+/).slice(0,Math.max(3,Math.ceil(cur.split(/\s+/).length*.6))).join(' ').replace(/[,;:]$/,'')+'.';
  if(out===cur){toast('That is already short and sweet');return;}
  typeInto(el,out);return;
 }
 const pool=rewritePool(S.sel);
 if(!pool){toast('Rewrite works on headlines, intros and service copy in this demo');return;}
 const opts=pool.filter(p=>p!==cur);const rw=S.site.rw;rw[S.sel]=((rw[S.sel]||0)+1)%opts.length;
 typeInto(el,opts[rw[S.sel]]);
}

function paintSave(){const e=$('#savest');if(e){e.textContent={saving:'Saving…',saved:'All changes saved',error:'Not saved'}[S.saveState];e.dataset.s=S.saveState;}}
function queueSave(){
 if(!S.pid||!S.site||!sb)return;
 S.saveState='saving';paintSave();clearTimeout(saveT);
 saveT=setTimeout(async()=>{
  const r=await sb.from('projects').update({name:S.site.c.name,data:{site:S.site,biz:S.biz},updated_at:new Date().toISOString()}).eq('id',S.pid);
  S.saveState=r.error?'error':'saved';paintSave();if(r.error)toast('Not saved: '+r.error.message);
 },1000);
}
function shrink(file,max,png){return new Promise(res=>{const img=new Image(),u=URL.createObjectURL(file);img.onload=()=>{let w=img.naturalWidth||max,h=img.naturalHeight||max;const s=Math.min(1,max/Math.max(w,h));w=Math.round(w*s);h=Math.round(h*s);const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);URL.revokeObjectURL(u);c.toBlob(b=>res(b||file),png?'image/png':'image/jpeg',.85);};img.onerror=()=>{URL.revokeObjectURL(u);res(file);};img.src=u;});}
async function uploadImg(file,isLogo){
 try{
  const blob=await shrink(file,isLogo?600:1600,isLogo);
  if(!S.user||!sb)return await readFile(blob);
  const ext=blob.type==='image/png'?'png':'jpg';
  const path=`${S.user.id}/${Date.now()}-${Math.random().toString(36).slice(2,8)}.${ext}`;
  const r=await sb.storage.from('site-images').upload(path,blob,{contentType:blob.type});
  if(r.error)throw r.error;
  return sb.storage.from('site-images').getPublicUrl(path).data.publicUrl;
 }catch(err){toast('Photo could not upload: '+(err.message||err));return readFile(file);}
}
async function doPublish(){
 const sub=slug($('#pub-sub').value);if(!S.pid){toast('This site has not been saved yet');return;}
 const r=await sb.from('projects').update({slug:sub,published:true,name:S.site.c.name,data:{site:S.site,biz:S.biz},updated_at:new Date().toISOString()}).eq('id',S.pid);
 if(r.error){toast(r.error.code==='23505'?'That address is taken. Try another one.':'Could not publish: '+r.error.message);return;}
 S.published=sub;render();toast('Published');
}
async function boot(){
 if(!sb){$('#app').innerHTML='<main class="pub-missing"><h1>Could not connect</h1><p>Check your internet connection and refresh the page.</p></main>';return;}
 const q=PARAMS.get('site');
 if(q){
  S.view='public';S.page='home';
  const r=await sb.from('projects').select('id,data').eq('slug',q).eq('published',true).maybeSingle();
  S.pub=(r.error||!r.data||!r.data.data.site)?{missing:true}:{id:r.data.id,site:r.data.data.site};
  if(S.pub.site){document.title=S.pub.site.seo.title;const m=document.querySelector('meta[name="description"]');if(m)m.setAttribute('content',S.pub.site.seo.desc);}
  render();return;
 }
 const {data}=await sb.auth.getSession();
 if(location.hash.includes('access_token')||PARAMS.has('code'))history.replaceState(null,'',APP_URL);
 sb.auth.onAuthStateChange((ev,session)=>{const u=session?session.user:null;if((u&&u.id)!==(S.user&&S.user.id))setTimeout(()=>setUser(u),0);});
 await setUser(data.session?data.session.user:null);
}

/* ---------- Render ---------- */
function render(){
 if(S.view==='public'){$('#app').innerHTML=publicHTML();return;}
 const v={boot:bootHTML,auth:authHTML,dash:dashHTML,quiz:quizHTML,gen:genHTML,edit:editHTML}[S.view]();
 $('#app').innerHTML=header()+v+(S.modal?modalHTML():'');
 if(S.view==='quiz')updateLive();
 if(S.view==='gen'){fitThumbs();if(!S.options.length)runGen();}
 requestAnimationFrame(fitThumbs);
}

/* ---------- Events ---------- */
const QF={'q-name':'name','q-city':'city','q-phone':'phone','q-services':'services','q-diff':'diff','q-ig':'ig','q-gbiz':'gbiz'};
document.addEventListener('input',e=>{
 const id=e.target.id;
 if(QF[id]){S.biz[QF[id]]=e.target.value;updateLive();return;}
 if(e.target.closest('.frame')&&e.target.dataset.k){const k=e.target.dataset.k,v=e.target.innerText;setP(S.site.c,k,v);syncSame(e.target,v);return;}
 if(id==='e-accent'){S.site.accent=e.target.value;const st=$('.frame .site');if(st)st.setAttribute('style',siteVars(S.site));return;}
 if(id==='e-phone'||id==='e-hours'){const k=id==='e-phone'?'phone':'hours';S.site.c[k]=e.target.value;$$(`.frame [data-k="${k}"]`).forEach(o=>o.textContent=e.target.value);return;}
 if(id==='seo-title'||id==='seo-desc'||id==='seo-kw'){
  const k={'seo-title':'title','seo-desc':'desc','seo-kw':'kw'}[id];S.site.seo[k]=e.target.value;
  if(k==='title'){$('#serp-t').textContent=e.target.value;const c=$('#c-title');c.textContent=e.target.value.length+' / 60';c.classList.toggle('over',e.target.value.length>60);}
  if(k==='desc'){$('#serp-d').textContent=e.target.value;const c=$('#c-desc');c.textContent=e.target.value.length+' / 155';c.classList.toggle('over',e.target.value.length>155);}
 }
});
document.addEventListener('change',e=>{
 const t=e.target;
 if(t.id==='e-accent')renderSide();
 if(t.dataset.opt){S.site.opts[t.dataset.opt]=t.checked;renderCanvas();toast(t.checked?'Section added':'Section hidden');}
 if(t.id==='q-logo'&&t.files[0]){toast('Uploading logo…');uploadImg(t.files[0],true).then(d=>{S.logo=d;render();});}
 if(t.id==='q-photos'&&t.files.length){toast('Uploading photos…');Promise.all(Array.from(t.files).slice(0,6).map(f=>uploadImg(f,false))).then(a=>{S.photos=a.slice(0,6);render();});}
 if(t.id==='img-swap'&&t.files[0]){const k=t.dataset.k;toast('Uploading photo…');uploadImg(t.files[0],false).then(d=>{S.site.imgs[k]=d;renderCanvas();queueSave();toast('Photo updated');});t.value='';}
});
function readFile(f){return new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(f);});}
document.addEventListener('input',()=>{if(S.view==='edit')queueSave();});
document.addEventListener('change',e=>{if(S.view==='edit'&&e.target.id!=='img-swap')queueSave();});
document.addEventListener('focusin',e=>{
 const el=e.target;
 if(el.closest&&el.closest('.frame')&&el.dataset.k){S.sel=el.dataset.k;showChip(el);if(S.tab==='content')renderSide();}
});
document.addEventListener('focusout',e=>{if(e.target.closest&&e.target.closest('.frame')&&e.target.dataset.k)setTimeout(()=>{const a=document.activeElement;if(!a||!a.dataset||!a.dataset.k)hideChip();},150);});
document.addEventListener('mousedown',e=>{if(e.target.closest('#fchip')||e.target.closest('[data-act="rewrite"],[data-act="shorter"]'))e.preventDefault();});
document.addEventListener('submit',async e=>{
 e.preventDefault();const f=e.target;
 if(f.id==='auth-form'){
  const email=$('#au-email').value.trim(),pass=$('#au-pass').value;
  if(!email||pass.length<6){S.authMsg='Enter your email and a password of at least 6 characters.';render();return;}
  const go=$('#au-go');go.disabled=true;go.textContent='One moment…';
  const r=S.authMode==='up'?await sb.auth.signUp({email,password:pass,options:{emailRedirectTo:APP_URL}}):await sb.auth.signInWithPassword({email,password:pass});
  if(r.error){S.authMsg=r.error.message;render();return;}
  if(S.authMode==='up'&&!r.data.session){S.authMsg='Check your inbox and click the confirmation link, then sign in here.';S.authMode='in';render();}
  return;
 }
 if(!f.classList.contains('s-form'))return;
 if(S.view==='public'){
  const g=id=>{const el=document.getElementById(id+'-public');return el?el.value.trim():'';};
  const row={project_id:S.pub.id,name:g('bf-name'),phone:g('bf-phone'),service:g('bf-svc'),date:g('bf-date'),time:g('bf-time')};
  if(!row.name||!row.phone){toast('Please add your name and phone number');return;}
  const btn=f.querySelector('button');btn.disabled=true;btn.textContent='Sending…';
  const r=await sb.from('bookings').insert(row);
  if(r.error){btn.disabled=false;btn.textContent='Request booking';toast('Could not send your request. Please call us instead.');return;}
  f.innerHTML=`<h3>Request sent</h3><p class="s-sent">Thanks, ${esc(row.name)}. Your ${esc(row.service)} request is in. We will confirm by phone soon.</p>`;
  return;
 }
 if(!S.preview){toast('Switch to Preview to try the booking form');return;}
 const n=f.querySelector('input').value||'there';const sv=f.querySelector('select').value;
 f.innerHTML=`<h3>Request sent</h3><p class="s-sent">Thanks, ${esc(n)}. Your ${esc(sv)} request is in. We will confirm by text within the hour. (Demo: nothing was sent.)</p>`;
});
document.addEventListener('click',e=>{
 const pubEl=e.target.closest('#pub');
 if(pubEl){const pg=e.target.closest('[data-page]');if(pg){e.preventDefault();S.page=pg.dataset.page;render();window.scrollTo(0,0);}return;}
 // customer-site navigation & photos inside editor
 const fr=e.target.closest('.frame');
 if(fr){
  if(e.target.closest('[contenteditable="true"]'))return;
  const ph=e.target.closest('[data-img]');
  if(ph&&!S.preview){const inp=$('#img-swap');inp.dataset.k=ph.dataset.img;inp.click();return;}
  const pg=e.target.closest('[data-page]');
  if(pg){e.preventDefault();S.page=pg.dataset.page;render();$('#cwrap')&&window.scrollTo({top:0,behavior:RM?'auto':'smooth'});return;}
 }
 const b=e.target.closest('[data-act]');if(!b)return;
 const a=b.dataset.act,v=b.dataset.v;
 switch(a){
  case 'theme':document.documentElement.setAttribute('data-theme',isDark()?'light':'dark');$('.bar [data-act="theme"]').innerHTML=isDark()?IC.sun:IC.moon;break;
  case 'go':S.view=v;S.modal=null;S.delId=null;if(v==='dash'){loadProjects().then(render);}render();break;
  case 'authmode':S.authMode=S.authMode==='up'?'in':'up';S.authMsg='';render();break;
  case 'google':sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:APP_URL}}).then(r=>{if(r.error){S.authMsg='Google sign-in is not set up yet. Use email for now.';render();}});break;
  case 'signout':sb.auth.signOut();break;
  case 'newsite':S.biz=defaultBiz();S.logo=null;S.photos=[];S.options=[];S.site=null;S.pid=null;S.published=null;S.step=0;S.view='quiz';render();window.scrollTo(0,0);break;
  case 'open':{const p=S.projects.find(x=>x.id===v);if(!p||!p.data.site)break;S.site=p.data.site;S.biz=p.data.biz||defaultBiz();S.logo=S.site.logo||null;S.pid=p.id;S.published=p.published?p.slug:null;S.options=[];S.view='edit';S.page='home';S.tab='design';S.sel=null;S.preview=false;S.saveState='saved';render();window.scrollTo(0,0);break;}
  case 'del':if(S.delId!==v){S.delId=v;render();break;}sb.from('projects').delete().eq('id',v).then(r=>{if(r.error)toast('Could not delete: '+r.error.message);else toast('Site deleted');S.delId=null;loadProjects().then(render);});break;
  case 'bk':S.showBk=S.showBk===v?null:v;render();break;
  case 'unpublish':sb.from('projects').update({published:false}).eq('id',S.pid).then(r=>{if(r.error){toast('Could not unpublish: '+r.error.message);return;}S.published=null;S.modal=null;render();toast('Site unpublished');});break;
  case 'ind':{const old=S.biz.industry;S.biz.industry=v;S.biz.services=IND[v].services.join(', ');if(!S.biz.name||S.biz.name===IND[old].sample)S.biz.name=IND[v].sample;if(!S.biz.diff||S.biz.diff===IND[old].diff)S.biz.diff=IND[v].diff;render();break;}
  case 'price':S.biz.price=v;render();break;
  case 'vibe':S.biz.vibe=v;render();break;
  case 'pal':S.biz.pal=v;render();break;
  case 'next':S.step=Math.min(3,S.step+1);render();window.scrollTo(0,0);break;
  case 'back':S.step=Math.max(0,S.step-1);render();break;
  case 'generate':S.options=[];S.site=null;S.published=null;S.view='gen';render();window.scrollTo(0,0);break;
  case 'regen':S.seed=(S.seed+1)%3;S.options=S.options.map((o,i)=>{const n=makeSite(i);return n;});render();toast('Fresh copy written for all three designs');break;
  case 'choose':S.site=JSON.parse(JSON.stringify(S.options[+v]));S.published=null;S.view='edit';S.page='home';S.tab='design';S.sel=null;S.preview=false;S.saveState='saving';render();window.scrollTo(0,0);
   createProject(S.site).then(id=>{S.pid=id;S.saveState=id?'saved':'error';paintSave();if(id)toast('Saved to My sites. Click any text to edit it.');});break;
  case 'tab':S.tab=v;renderSide();break;
  case 'tpl':S.site.tpl=v;renderCanvas();renderSide();break;
  case 'spal':S.site.pal=v;S.site.accent=null;renderCanvas();renderSide();break;
  case 'resetacc':S.site.accent=null;renderCanvas();renderSide();break;
  case 'font':S.site.font=v;renderCanvas();renderSide();break;
  case 'page':S.page=v;render();break;
  case 'device':S.device=v;const f=$('.frame');f.className='frame '+v;$$('.ebar [data-act="device"]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.v===v));hideChip();break;
  case 'preview':S.preview=!S.preview;S.sel=null;render();break;
  case 'rewrite':doRewrite(false);break;
  case 'shorter':doRewrite(true);break;
  case 'publish':S.modal='publish';render();break;
  case 'close':S.modal=null;render();break;
  case 'closebg':if(e.target===b){S.modal=null;render();}break;
  case 'upgrade':toast('Pro plan checkout is coming soon');break;
  case 'dopublish':doPublish();break;
  case 'copyurl':{const u=pubURL(S.published);try{navigator.clipboard.writeText(u).then(()=>toast('Link copied'),()=>toast(u));}catch(_){toast(u);}break;}
 }
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.modal){S.modal=null;render();}});
document.addEventListener('click',e=>{if(S.view==='edit'&&e.target.closest&&e.target.closest('[data-act="tpl"],[data-act="spal"],[data-act="font"],[data-act="resetacc"],[data-act="rewrite"],[data-act="shorter"]'))setTimeout(queueSave,400);});

render();
boot();
})();
</script>
